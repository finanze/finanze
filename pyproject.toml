[project]
name = "finanze"
authors = [{ name = "Marcos Alvarez", email = "contact@finanze.me" }]
version = "0.10.2"
description = "Self-hosted personal finance and net worth tracker that aggregates assets and investments across banks, brokers, crypto and real estate."
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["dependencies", "version"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --ignore=tests/e2e"
pythonpath = ["finanze"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["finanze"]
omit = ["finanze/__pycache__/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

