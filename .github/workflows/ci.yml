name: CI

on:
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          cache: 'pip'
          cache-dependency-path: 'requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests
        run: pytest

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          cache: 'pip'
          cache-dependency-path: 'requirements*.txt'

      - name: Install Python linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt

      - name: Check Python formatting with ruff
        run: |
          echo "Checking Python code formatting..."
          ruff check .
          ruff format --check .

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/app/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: 'frontend/app/pnpm-lock.yaml'

      - name: Install frontend dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Check frontend linting
        working-directory: frontend/app
        run: pnpm run lint

      - name: Check frontend formatting with prettier
        working-directory: frontend/app
        run: pnpm exec prettier --check .

  e2e:
    name: E2E Tests (${{ matrix.label }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest (1/2)
            os: ubuntu-latest
            shard: '1/2'
            artifact: ubuntu-latest-1
          - label: ubuntu-latest (2/2)
            os: ubuntu-latest
            shard: '2/2'
            artifact: ubuntu-latest-2
          - label: macos-latest
            os: macos-latest
            artifact: macos-latest
          - label: windows-latest
            os: windows-latest
            artifact: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Configure Windows Defender exclusions for E2E temp directories
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:TEMP, $env:GITHUB_WORKSPACE

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.10'
          cache: 'pip'
          cache-dependency-path: 'requirements*.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/app/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/app/pnpm-lock.yaml
            e2e/standard/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        working-directory: e2e/standard
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/standard/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: e2e/standard
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 60000
        run: pnpm exec playwright install chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: e2e/standard
        run: pnpm exec playwright install-deps chromium

      - name: Run full E2E suite (Linux)
        if: runner.os == 'Linux'
        working-directory: e2e/standard
        run: pnpm exec playwright test --shard=${{ matrix.shard }}

      - name: Run multiplatform E2E tests (macOS & Windows)
        if: runner.os != 'Linux'
        working-directory: e2e/standard
        env:
          E2E_CLOUD_ONLY: '1'
        run: pnpm exec playwright test --project=cloud-backup --project=cloud-restore

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: e2e/standard/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-gate:
    name: E2E Tests
    timeout-minutes: 5
    needs: [e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Check E2E matrix result
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "E2E matrix failed or was cancelled (result: ${{ needs.e2e.result }})"
            exit 1
          fi
          echo "All E2E matrix jobs succeeded"

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/app/.nvmrc
          cache: 'pnpm'
          cache-dependency-path: 'frontend/app/pnpm-lock.yaml'

      - name: Install frontend dependencies
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend/app
        run: pnpm test

