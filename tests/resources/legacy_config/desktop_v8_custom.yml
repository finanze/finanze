lastUpdate: 2026-03-01T10:00:00+01:00
version: 8
general:
  defaultCurrency: USD
  defaultCommodityWeightUnit: TROY_OUNCE
  editMode: DRAFT
data:
  autoRefresh:
    mode: OFF
    max_outdated: WEEK
    entities:
    - id: e0000000-0000-0000-0000-000000000001
    - id: e0000000-0000-0000-0000-000000000002
export:
  sheets:
    globals:
      spreadsheetId: sheet-global
      dateFormat: '%d/%m/%Y'
    position:
    - range: Positions!A1
      lastUpdate: yes
      data:
      - STOCK_ETF
      - FUND
      filters:
      - field: entity
        values:
        - MyBank
    transactions:
    - range: Txs!A1
      spreadsheetId: sheet-txs
      data:
      - ACCOUNT
      template:
        id: tpl-1
        params:
          sep: ;
importing:
  sheets:
    globals:
      spreadsheetId: sheet-import
    position:
    - range: Import!A1
      template:
        id: tpl-2
      data: DEPOSIT
assets:
  crypto:
    stablecoins:
    - USDC
    - EURC
    - PUSD
    hideUnknownTokens: yes
labeling:
  external:
    enabled: no
    autoRun: yes
    minConfidence: 70
    maxPerRun: 400
    examples:
      enabled: no
      count: 20
      origins:
      - MANUAL
      - RULE
